
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Wedding of Dito &amp; Dini</title>
  <meta name="description" content="Undangan pernikahan Dito dan Dini.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="The Wedding of Dito &amp; Dini">
  <meta property="og:description" content="Dengan penuh kebahagiaan, kami mengundang Anda ke pernikahan Dito dan Dini.">
  <meta property="og:url" content="https://diposaabhyaktamandiri.github.io/thumbnail-manager-test/">
  <meta property="og:image" content="https://placehold.co/1200x630/png?text=Dito+%26+Dini">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">

  <meta name="twitter:card" content="summary_large_image">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f0eb;
      color: #493a35;
      font-family: Georgia, serif;
      text-align: center;
    }

    .invitation {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      background: #fffdf9;
      border: 1px solid #d8c3ad;
      border-radius: 18px;
      box-shadow: 0 12px 36px #493a3514;
    }

    .eyebrow {
      color: #a17b5b;
      letter-spacing: 4px;
      font: 12px Arial, sans-serif;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 8vw, 44px);
      font-weight: normal;
    }

    .ampersand {
      color: #b28b67;
      font-style: italic;
    }

    .description {
      font: 15px/1.8 Arial, sans-serif;
      color: #74645b;
    }

    .preview {
      width: 100%;
      margin-top: 20px;
      border-radius: 10px;
    }

    .note {
      margin-top: 18px;
      font: 12px/1.7 Arial, sans-serif;
      color: #88796e;
    }
  </style>
</head>
<body>
  <main class="invitation">
    <p class="eyebrow">The Wedding Of</p>
    <h1>Dito <span class="ampersand">&amp;</span> Dini</h1>
    <p class="description">
      Dengan penuh kebahagiaan, kami mengundang Anda
      untuk merayakan hari istimewa kami.
    </p>

    <img
      class="preview"
      src="https://placehold.co/1200x630/png?text=Dito+%26+Dini"
      alt="Contoh thumbnail Dito dan Dini"
    >

    <p class="note">
      Halaman demo untuk pengujian thumbnail dan Open Graph.
    </p>
  </main>
</body>
</html>
